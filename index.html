<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcoRotação - Simulador Agrinho</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header>
        <div class="header-container">
            <div class="logo-area">
                <span class="logo-icone">🌱</span>
                <h1>Agro Forte, Futuro Sustentável</h1>
            </div>
            <p class="subtitulo">Simulador de Rotação de Culturas • Equilíbrio entre Produção e Meio Ambiente</p>
        </div>
    </header>

    <main>
        <section class="painel-controles">
            <div class="controle-item">
                <label for="cultura-select">Escolha uma cultura:</label>
                <select id="cultura-select">
                    <option value="Soja">Soja 🌱</option>
                    <option value="Milho">Milho 🌽</option>
                    <option value="Pastagem">Pastagem 🌾</option>
                </select>
            </div>
            
            <div class="botoes-grupo">
                <button id="btn-plantar-todos" class="btn-principal">Plantar em Todos os Lotes</button>
                <button id="btn-proxima-safra" class="btn-secundario">Próxima Safra 🔄</button>
            </div>

            <div class="contador-safra">
                <span>Safra Atual:</span>
                <strong id="safra-valor">1</strong>
            </div>
        </section>

        <section class="fazenda-grid">
            <div class="lote-card" id="lote-1">
                <h3>Lote 1</h3>
                <div class="cultura-display">Vazio</div>
                <div class="status-badge status-fertil">Fértil</div>
            </div>

            <div class="lote-card" id="lote-2">
                <h3>Lote 2</h3>
                <div class="cultura-display">Vazio</div>
                <div class="status-badge status-fertil">Fértil</div>
            </div>

            <div class="lote-card" id="lote-3">
                <h3>Lote 3</h3>
                <div class="cultura-display">Vazio</div>
                <div class="status-badge status-fertil">Fértil</div>
            </div>

            <div class="lote-card" id="lote-4">
                <h3>Lote
